name: TEMP finviz table debug
on:
  push:
    branches: [claude/wizardly-cray-iak0wx]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt
      - run: python scripts/debug_finviz_table.py
        env: {PYTHONPATH: .}
